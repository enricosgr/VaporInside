name: Pubblica su GitHub Pages

on:
  push:
    branches: [main, claude/dreamy-turing-8erkoo]
  schedule:
    - cron: "17 */3 * * *"   # aggiorna video e recensioni ogni 3 ore
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scarica ultimi video YouTube
        run: node scripts/fetch-videos.mjs
        env:
          YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
      - name: Scarica recensioni Google
        run: node scripts/fetch-reviews.mjs
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ vars.GOOGLE_PLACE_ID }}
      - name: Prepara il sito
        run: |
          mkdir _site
          cp -r index.html css js assets data _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
